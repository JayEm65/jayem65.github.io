<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Eleftheria</title>

<style>

body {
    background: #faf8f5;
    color: #222;
    font-family: "Courier New", Courier, monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 750px;
    margin: 60px auto;
    padding: 0 25px;
}

h1 {
    font-size: 28px;
    font-weight: normal;
    text-align: center;
    margin-bottom: 50px;
}

.letter {
    white-space: pre-line;
    font-size: 16px;
}

.divider {
    margin: 60px 0;
    text-align: center;
    font-size: 22px;
}

.gallery {
    display: flex;
    flex-direction: column;
    gap: 35px;
}

.gallery img {
    width: 100%;
    height: auto;
    display: block;
}

.caption {
    font-size: 13px;
    text-align: center;
    color: #777;
}

input {
    display: block;
    width: 250px;
    max-width: 90%;
    margin: 20px auto;
    padding: 12px;
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    text-align: center;
    border: 1px solid #999;
    background: white;
}

button {
    display: block;
    margin: 0 auto;
    padding: 12px 25px;
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    cursor: pointer;
    border: 1px solid #555;
    background: transparent;
}

button:hover {
    background: #eee;
}

#error {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

footer {
    text-align: center;
    margin: 70px 0 30px;
    font-size: 13px;
    color: #777;
}

</style>

</head>


<body>


<!-- PASSWORD SCREEN -->

<div id="lockscreen" class="container">

<h1>A private letter</h1>

<p style="text-align:center;">
Please enter the code to continue.
</p>


<input 
id="password" 
type="password" 
placeholder="Enter code"
>


<button onclick="unlock()">
Open
</button>


<p id="error"></p>


</div>



<!-- HIDDEN CONTENT -->

<div id="content" class="container" style="display:none;">


<h1>For Eleftheria</h1>



<div class="letter">


Dear Eleftheria,


Paste your letter here.


Keep the spacing exactly how you want it.


Some words can stand alone.


Some memories deserve their own space.


Your ending goes here.


Marc


</div>



<div class="divider">
✦
</div>



<div class="gallery">


<img src="images/photo1.jpg" alt="Memory 1">


<img src="images/photo2.jpg" alt="Memory 2">


<img src="images/photo3.jpg" alt="Memory 3">


</div>



<footer>

A collection of memories

</footer>



</div>



<script>


function unlock() {


    const entered = document.getElementById("password").value;


    const correct = "YOURCODEHERE";


    if (entered === correct) {


        document.getElementById("lockscreen").style.display = "none";

        document.getElementById("content").style.display = "block";


    } else {


        document.getElementById("error").innerHTML =
        "Wrong code.";


    }


}


</script>



</body>

</html>
