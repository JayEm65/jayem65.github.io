<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Eleftheria</title>

<style>

body {
    background: #faf8f5;
    color: #222;
    font-family: "Courier New", "IBM Plex Mono", "Lucida Console", "Monaco", monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 750px;
    margin: 60px auto;
    padding: 0 25px;
}

h1 {
    font-size: 28px;
    font-weight: normal;
    text-align: center;
    margin-bottom: 50px;
}

.letter {
    font-size: 16px;
    line-height: 1.7;
    white-space: normal;
    letter-spacing: 0.01em;
}

.letter p {
    margin: 0 0 1.1em;
}

.letter .divider-line {
    text-align: center;
    margin: 2.2em 0 1.8em;
    letter-spacing: 0.2em;
    color: #8a7d6c;
}

.divider {
    margin: 60px 0;
    text-align: center;
    font-size: 22px;
}
hr.divider {
    border: 0;
    border-top: 1px solid #d8cfc2;
    margin: 48px 0;
}
.gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
}

.gallery-item {
    overflow: hidden;
    border: none;
    background: transparent;
    cursor: pointer;
}

.gallery-item img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.gallery-item:hover img {
    transform: scale(1.02);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}

@media (max-width: 700px) {
    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 480px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}

.caption {
    font-size: 13px;
    text-align: center;
    color: #777;
}

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
}

.lightbox.open {
    display: flex;
}

.lightbox-inner {
    position: relative;
    width: min(100%, 1100px);
    height: min(100%, 90vh);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
}

.lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
}

.lightbox-nav,
.lightbox-close {
    position: absolute;
    border: none;
    background: transparent;
    color: white;
    cursor: pointer;
    font-family: "Courier New", Courier, monospace;
    font-size: 20px;
    padding: 0;
    line-height: 1;
    opacity: 0.9;
}

.lightbox-nav {
    top: 50%;
    transform: translateY(-50%);
}

.lightbox-nav.prev {
    left: -6px;
}

.lightbox-nav.next {
    right: -6px;
}

.lightbox-close {
    top: 6px;
    right: 6px;
    font-size: 22px;
}

.lightbox-nav:hover,
.lightbox-close:hover {
    opacity: 1;
}

input {
    display: block;
    width: 250px;
    max-width: 90%;
    margin: 20px auto;
    padding: 12px;
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    text-align: center;
    border: 1px solid #999;
    background: white;
}

button {
    display: block;
    margin: 0 auto;
    padding: 12px 25px;
    font-family: "Courier New", Courier, monospace;
    font-size: 16px;
    cursor: pointer;
    border: 1px solid #555;
    background: transparent;
}

button:hover {
    background: #eee;
}

#error {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

footer {
    text-align: center;
    margin: 70px 0 30px;
    font-size: 13px;
    color: #777;
}

</style>
</head>

<body>


<!-- PASSWORD SCREEN -->

<div id="lockscreen" class="container">

<h1>a private letter</h1>

<p style="text-align:center;">
Please enter the code to continue.
</p>


<input 
id="password" 
type="password" 
placeholder=""
 onkeydown="if (event.key === 'Enter') { unlock(); }"
>


<button onclick="unlock()">
Open
</button>


<p id="error"></p>


</div>



<!-- HIDDEN CONTENT -->

<div id="content" class="container" style="display:none;">


<h1>for you</h1>

<hr class="divider">

<div class="letter" id="letter-content">
Opening the envelope…
</div>

<hr class="divider">

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox-inner">
        <button class="lightbox-close" type="button" aria-label="Close photo">×</button>
        <button class="lightbox-nav prev" type="button" aria-label="Previous photo">‹</button>
        <img id="lightbox-image" src="" alt="">
        <button class="lightbox-nav next" type="button" aria-label="Next photo">›</button>
    </div>
</div>

<footer>

a collection of memories

</footer>



</div>



<script>
const imageFiles = [
    'photos/photo-01.jpg',
    'photos/photo-02.jpg',
    'photos/photo-03.jpg',
    'photos/photo-04.jpg',
    'photos/photo-05.jpg',
    'photos/photo-06.jpg',
    'photos/photo-07.jpg',
    'photos/photo-08.jpg',
    'photos/photo-09.jpg',
    'photos/photo-10.jpg',
    'photos/photo-11.jpg',
    'photos/photo-12.jpg',
    'photos/photo-13.jpg',
    'photos/photo-14.jpg',
    'photos/photo-15.jpg',
    'photos/photo-16.jpg',
    'photos/photo-17.jpg',
    'photos/photo-18.jpg',
    'photos/photo-19.jpg',
    'photos/photo-20.jpg',
    'photos/photo-21.jpg',
    'photos/photo-22.jpg',
    'photos/photo-23.jpg',
    'photos/photo-24.jpg',
    'photos/photo-25.jpg',
    'photos/photo-26.jpg',
    'photos/photo-27.jpg',
    'photos/photo-28.jpg',
    'photos/photo-29.jpg',
    'photos/photo-30.jpg',
    'photos/photo-31.jpg',
    'photos/photo-32.jpg',
    'photos/photo-33.jpg',
    'photos/photo-34.jpg',
    'photos/photo-35.jpg',
    'photos/photo-36.jpg'
];

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightbox-image');
const closeButton = document.querySelector('.lightbox-close');
const prevButton = document.querySelector('.lightbox-nav.prev');
const nextButton = document.querySelector('.lightbox-nav.next');
const letterContent = document.getElementById('letter-content');
let currentIndex = 0;
let galleryImages = [];
let encryptedLetter = null;

function buildGallery() {
    gallery.innerHTML = '';
    galleryImages = [];

    imageFiles.forEach((src, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';

        const img = document.createElement('img');
        const cacheBuster = Date.now() + index;
        img.src = `${src}?v=${cacheBuster}`;
        img.alt = `Memory ${index + 1}`;
        img.addEventListener('click', () => {
            openLightbox(index);
        });

        item.appendChild(img);
        gallery.appendChild(item);
        galleryImages.push(img);
    });
}

function openLightbox(index) {
    currentIndex = index;
    lightboxImage.src = galleryImages[currentIndex].src;
    lightboxImage.alt = galleryImages[currentIndex].alt;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
}

function showNextImage() {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    lightboxImage.src = galleryImages[currentIndex].src;
    lightboxImage.alt = galleryImages[currentIndex].alt;
}

function showPreviousImage() {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    lightboxImage.src = galleryImages[currentIndex].src;
    lightboxImage.alt = galleryImages[currentIndex].alt;
}

function hexToBytes(hex) {
    const bytes = [];
    for (let i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.slice(i, i + 2), 16));
    }
    return bytes;
}

function decryptLetter(ciphertext, password) {
    const passwordBytes = new TextEncoder().encode(password);
    const dataBytes = hexToBytes(ciphertext);
    const output = new Uint8Array(dataBytes.length);

    for (let i = 0; i < dataBytes.length; i += 1) {
        const passwordByte = passwordBytes[i % passwordBytes.length];
        const key = (passwordByte + i + (i % 7)) % 256;
        output[i] = dataBytes[i] ^ key;
    }

    return new TextDecoder().decode(output);
}

async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, '0')).join('');
}

async function loadEncryptedLetter() {
    try {
        const response = await fetch('encrypted-letter.json');
        if (!response.ok) {
            throw new Error('Could not load the letter file.');
        }
        encryptedLetter = await response.json();
        letterContent.textContent = 'The letter is ready to be unlocked.';
    } catch (error) {
        letterContent.textContent = 'The letter could not be loaded.';
        console.error(error);
    }
}

buildGallery();

closeButton.addEventListener('click', closeLightbox);
prevButton.addEventListener('click', showPreviousImage);
nextButton.addEventListener('click', showNextImage);

lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener('keydown', (event) => {
    if (!lightbox.classList.contains('open')) {
        return;
    }

    if (event.key === 'Escape') {
        closeLightbox();
    } else if (event.key === 'ArrowRight') {
        showNextImage();
    } else if (event.key === 'ArrowLeft') {
        showPreviousImage();
    }
});

async function unlock() {
    const entered = document.getElementById('password').value.trim();

    if (!encryptedLetter) {
        document.getElementById('error').innerHTML = 'The letter is still loading.';
        return;
    }

    const enteredHash = await sha256(entered);

    if (enteredHash === encryptedLetter.passwordHash) {
        const decrypted = decryptLetter(encryptedLetter.ciphertext, entered);
        const formatted = decrypted
            .replace(/\r/g, '')
            .split(/\n\n+/)
            .map((block) => block.trim())
            .filter(Boolean)
            .map((block) => {
                if (block.includes('~✦~')) {
                    return `<div class="divider-line">~✦~</div>`;
                }
                return `<p>${block.replace(/\n/g, ' ')}</p>`;
            })
            .join('');
        letterContent.innerHTML = formatted;
        document.getElementById('error').innerHTML = '';
        document.getElementById('lockscreen').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    } else {
        document.getElementById('error').innerHTML = 'Wrong code.';
    }
}

loadEncryptedLetter();


</script>



</body>

</html>
