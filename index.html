<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Eleftheria</title>

<style>

body {
    background: #faf8f5;
    color: #222;
    font-family: "Courier New", Courier, monospace;
    line-height: 1.8;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 750px;
    margin: 60px auto;
    padding: 0 25px;
}

h1 {
    font-size: 28px;
    font-weight: normal;
    text-align: center;
    margin-bottom: 50px;
}

.letter {
    white-space: pre-line;
    font-size: 16px;
}

.divider {
    margin: 60px 0;
    text-align: center;
    font-size: 20px;
}

.gallery {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.gallery img {
    width: 100%;
    height: auto;
    display: block;
}

.caption {
    font-size: 13px;
    text-align: center;
    color: #666;
    margin-top: -20px;
}

footer {
    text-align: center;
    margin: 70px 0 30px;
    font-size: 13px;
    color: #777;
}

</style>

</head>


<body>

<div class="container">

<h1>For Eleftheria</h1>


<div class="letter">

Dear Eleftheria,

Paste your letter here.

You can write normally.
The spacing will stay the same.

For example:

Some words can stand alone.

Some memories deserve their own space.

Your ending goes here.

Marc

</div>


<div class="divider">
✦
</div>


<div class="gallery">

<img src="images/photo1.jpg" alt="Memory 1">

<img src="images/photo2.jpg" alt="Memory 2">

<img src="images/photo3.jpg" alt="Memory 3">

</div>


<footer>
A collection of memories
</footer>


</div>

</body>
</html>
